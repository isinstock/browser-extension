<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Is In Stock</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        color: #6b7280;
        background: #ffffff;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      #root {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /* --- Shared layout --- */

      .view {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .view-content {
        flex: 1;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: #d1d5db #ffffff;
      }

      .view-content::-webkit-scrollbar {
        width: 6px;
      }
      .view-content::-webkit-scrollbar-track {
        background: #ffffff;
      }
      .view-content::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 3px;
      }

      .view-footer {
        padding: 12px;
        border-top: 1px solid #e5e7eb;
      }

      /* --- Buttons --- */

      .btn {
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 150ms ease;
        font-family: inherit;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .btn-primary {
        background: #00aae7;
        color: #fff;
      }

      .btn-primary:hover {
        background: #6350e9;
      }

      .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-secondary {
        background: transparent;
        color: #6b7280;
        border: 1px solid #d1d5db;
      }

      .btn-secondary:hover {
        background: #f3f4f6;
      }

      .btn-full {
        width: 100%;
      }

      .btn-back {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: #6b7280;
        cursor: pointer;
        flex-shrink: 0;
        transition:
          background 150ms ease,
          color 150ms ease;
      }

      .btn-back:hover {
        background: #f3f4f6;
        color: #111827;
      }

      /* --- Empty / loading states --- */

      .empty-state {
        padding: 32px 20px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .empty-state-icon {
        margin-bottom: 4px;
      }

      .empty-state-title {
        font-size: 14px;
        font-weight: 600;
        color: #111827;
      }

      .empty-state-body {
        font-size: 13px;
        color: #9ca3af;
        line-height: 1.5;
      }

      .loading-state {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 20px;
      }

      .spinner {
        width: 24px;
        height: 24px;
        border: 2px solid #e5e7eb;
        border-top-color: #00aae7;
        border-radius: 50%;
        animation: spin 600ms linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* --- Subscriptions list --- */

      .subscription-list {
        display: flex;
        flex-direction: column;
      }

      .subscription-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-bottom: 1px solid #e5e7eb;
        text-decoration: none;
        color: inherit;
        transition: background 150ms ease;
      }

      .subscription-item:hover {
        background: #f9fafb;
      }

      .subscription-image {
        flex-shrink: 0;
        width: 40px;
        height: 40px;
        border-radius: 6px;
        overflow: hidden;
        background: #f3f4f6;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .subscription-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .subscription-image-placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .subscription-info {
        flex: 1;
        min-width: 0;
      }

      .subscription-name {
        font-size: 13px;
        font-weight: 500;
        color: #111827;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .subscription-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 2px;
        font-size: 12px;
        color: #9ca3af;
      }

      .subscription-price {
        font-weight: 500;
        color: #6b7280;
      }

      .subscription-availability {
        flex-shrink: 0;
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }

      .subscription-availability.available {
        background: #32b91c;
      }

      .subscription-availability.unavailable {
        background: #ef4444;
      }

      /* --- Picker header --- */

      .picker-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px;
        border-bottom: 1px solid #e5e7eb;
      }

      /* --- Segmented control --- */

      .segment-control {
        display: flex;
        flex: 1;
        background: #f3f4f6;
        border-radius: 6px;
        padding: 2px;
      }

      .segment {
        flex: 1;
        padding: 6px 12px;
        border: none;
        border-radius: 5px;
        background: transparent;
        color: #6b7280;
        font-size: 13px;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        transition:
          background 150ms ease,
          color 150ms ease,
          box-shadow 150ms ease;
      }

      .segment:hover {
        color: #374151;
      }

      .segment.active {
        background: #ffffff;
        color: #111827;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      }

      /* --- Selector list --- */

      .selector-list {
        flex: 1;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: #d1d5db #ffffff;
      }

      .selector-list::-webkit-scrollbar {
        width: 6px;
      }
      .selector-list::-webkit-scrollbar-track {
        background: #ffffff;
      }
      .selector-list::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 3px;
      }

      .selector-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-bottom: 1px solid #e5e7eb;
        animation: fadeIn 150ms ease forwards;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .row-badge {
        flex-shrink: 0;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #32b91c;
        color: #fff;
        font-size: 11px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .row-preview {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        color: #111827;
      }

      .row-preview .muted {
        color: #9ca3af;
        font-style: italic;
      }

      .row-controls {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      .extract-select {
        padding: 4px 8px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        background: #ffffff;
        color: #374151;
        font-size: 12px;
        font-family: inherit;
        cursor: pointer;
        outline: none;
      }

      .extract-select:focus {
        border-color: #00aae7;
      }

      .remove-btn {
        flex-shrink: 0;
        width: 24px;
        height: 24px;
        border: none;
        border-radius: 4px;
        background: transparent;
        color: #6b7280;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          background 150ms ease,
          color 150ms ease;
      }

      .remove-btn:hover {
        background: rgba(239, 68, 68, 0.1);
        color: #ef4444;
      }

      /* --- Advanced section --- */

      .advanced-section {
        padding: 12px;
      }

      .advanced-input-row {
        display: flex;
        gap: 8px;
      }

      .advanced-input {
        flex: 1;
        padding: 8px 10px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        background: #ffffff;
        color: #111827;
        font-size: 13px;
        font-family: 'SF Mono', SFMono-Regular, ui-monospace, Menlo, monospace;
        outline: none;
        transition: border-color 150ms ease;
      }

      .advanced-input::placeholder {
        color: #9ca3af;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      .advanced-input:focus {
        border-color: #00aae7;
      }

      .advanced-input.invalid {
        border-color: #ef4444;
      }

      .btn-add {
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        background: #00aae7;
        color: #fff;
        font-size: 13px;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        white-space: nowrap;
        transition: background 150ms ease;
      }

      .btn-add:hover {
        background: #6350e9;
      }

      .btn-add:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .advanced-match-info {
        margin-top: 8px;
        font-size: 12px;
        color: #6b7280;
      }

      .match-count {
        font-weight: 600;
        color: #111827;
      }

      .match-count.zero {
        color: #ef4444;
      }

      .advanced-preview-list {
        margin-top: 8px;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        overflow: hidden;
      }

      .advanced-preview-item {
        padding: 6px 10px;
        font-size: 12px;
        color: #374151;
        border-bottom: 1px solid #e5e7eb;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .advanced-preview-item:last-child {
        border-bottom: none;
      }

      .advanced-preview-item .muted,
      .advanced-preview-item.muted {
        color: #9ca3af;
        font-style: italic;
      }

      .added-selectors-label {
        padding: 8px 12px 4px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #9ca3af;
        border-top: 1px solid #e5e7eb;
      }

      /* --- Toolbar --- */

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid #e5e7eb;
      }

      .toolbar-error {
        width: 100%;
        padding: 8px 10px;
        border-radius: 6px;
        background: #fef2f2;
        color: #dc2626;
        font-size: 13px;
        line-height: 1.4;
      }

      .toolbar-actions {
        display: flex;
        gap: 8px;
      }

      .btn-secondary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="sidepanel.js"></script>
  </body>
</html>
