<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Is In Stock</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #fff;
      background: #1e1b4b;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #root {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .panel {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .selector-list {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #4338ca #1e1b4b;
    }

    .selector-list::-webkit-scrollbar { width: 6px; }
    .selector-list::-webkit-scrollbar-track { background: #1e1b4b; }
    .selector-list::-webkit-scrollbar-thumb { background: #4338ca; border-radius: 3px; }

    .empty-state {
      padding: 24px 20px;
      color: #a5b4fc;
      text-align: center;
      font-size: 13px;
    }

    .selector-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      animation: fadeIn 150ms ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .row-badge {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #059669;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .row-preview {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      color: #e0e7ff;
    }

    .row-preview .muted {
      color: #818cf8;
      font-style: italic;
    }

    .row-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .extract-select {
      padding: 4px 8px;
      border: 1px solid #4338ca;
      border-radius: 4px;
      background: #312e81;
      color: #e0e7ff;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      outline: none;
    }

    .extract-select:focus {
      border-color: #6366f1;
    }

    .remove-btn {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #818cf8;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 150ms ease, color 150ms ease;
    }

    .remove-btn:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 150ms ease;
      font-family: inherit;
    }

    .btn-done {
      background: #4f46e5;
      color: #fff;
    }

    .btn-done:hover {
      background: #4338ca;
    }

    .btn-done:disabled {
      background: #6366f1;
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-cancel {
      background: transparent;
      color: #c7d2fe;
      border: 1px solid #4338ca;
    }

    .btn-cancel:hover {
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="sidepanel.js"></script>
</body>
</html>
