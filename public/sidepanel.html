<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Is In Stock</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        color: #fff;
        background: #111827;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      #root {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .panel {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .selector-list {
        flex: 1;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: #374151 #111827;
      }

      .selector-list::-webkit-scrollbar {
        width: 6px;
      }
      .selector-list::-webkit-scrollbar-track {
        background: #111827;
      }
      .selector-list::-webkit-scrollbar-thumb {
        background: #374151;
        border-radius: 3px;
      }

      .empty-state {
        padding: 24px 20px;
        color: #9ca3af;
        text-align: center;
        font-size: 13px;
      }

      .selector-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        animation: fadeIn 150ms ease forwards;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .row-badge {
        flex-shrink: 0;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #32b91c;
        color: #fff;
        font-size: 11px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .row-preview {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        color: #e5e7eb;
      }

      .row-preview .muted {
        color: #6b7280;
        font-style: italic;
      }

      .row-controls {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      .extract-select {
        padding: 4px 8px;
        border: 1px solid #374151;
        border-radius: 4px;
        background: #1f2937;
        color: #e5e7eb;
        font-size: 12px;
        font-family: inherit;
        cursor: pointer;
        outline: none;
      }

      .extract-select:focus {
        border-color: #00aae7;
      }

      .remove-btn {
        flex-shrink: 0;
        width: 24px;
        height: 24px;
        border: none;
        border-radius: 4px;
        background: transparent;
        color: #6b7280;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          background 150ms ease,
          color 150ms ease;
      }

      .remove-btn:hover {
        background: rgba(239, 68, 68, 0.2);
        color: #fca5a5;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }

      .toolbar-actions {
        display: flex;
        gap: 8px;
      }

      .btn {
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 150ms ease;
        font-family: inherit;
      }

      .btn-done {
        background: #00aae7;
        color: #fff;
      }

      .btn-done:hover {
        background: #6350e9;
      }

      .btn-done:disabled {
        background: #0ea5e9;
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-cancel {
        background: transparent;
        color: #d1d5db;
        border: 1px solid #374151;
      }

      .btn-cancel:hover {
        background: rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="sidepanel.js"></script>
  </body>
</html>
